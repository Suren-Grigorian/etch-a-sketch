<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel= "stylesheet" href="styles.css">
    <script src = "script.js" defer></script>
</head>
<body>
    
    <div class="slidecontainer">
        
        <input type="range" min="1" max="200" 
            value="16" class="slider" id="myRange">
        <output id="output" class="output">16</output>
        <button id="confirm">Confirm grid size</button>
    <div class="dropdown">
            <button onclick="dropDown()" class="dropbtn" id ="color-select">Choose colors &#9660;</button>
            <div id="myDropdown" class="dropdown-content">
                <a id="choice-default">Default</a>                
                <a id="choice-white">White and Black</a>
                <a id="choice-black">Black and White</a>
            </div>
    </div>
    </div>
    
    <div id="page">
        <h1 id="header">Welcome to Etch-a-Sketch</h1>
        
        <div id="container">
         </div>
        </div>
        <div id="buttons">
            <button id="default">Paint</button>
            <button id="shadow">Shadow</button>
            <button id="eraser">Eraser</button>
            <button id="rainbow">Rainbow Mode</button>
            <button id="reset">Reset the Board</button>
        </div>
    
</body>
</html>
